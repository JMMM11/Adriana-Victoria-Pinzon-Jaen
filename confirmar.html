<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3eb">
  <meta name="description" content="Confirma tu asistencia a los quince años de Adriana Victoria Pinzón Jaén.">
  <meta property="og:title" content="La Gran Noche · Adriana Victoria Pinzón Jaén">
  <meta property="og:description" content="Una nueva temporada. Una noche irrepetible. Estás cordialmente invitado.">
  <meta property="og:type" content="website">
  <!-- Imagen que aparece al compartir el enlace (WhatsApp, etc.): necesita la dirección completa -->
  <meta property="og:url" content="https://adrianavictoria.vercel.app/confirmar.html">
  <meta property="og:image" content="https://adrianavictoria.vercel.app/assets/portada-compartir.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>Confirmar asistencia · Adriana Victoria Pinzón Jaén</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/cormorant.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Estilos, en este orden: base, entrada y animaciones, tema de Adriana -->
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="experiencia.css">
  <link rel="stylesheet" href="adriana.css">
</head>
<body class="confirm-page">
  <a class="skip-link" href="#confirmar">Ir al formulario</a>

  <!-- Iconos: se dibujan una vez aquí y se reutilizan con <use> -->
  <svg class="symbol-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-crown" viewBox="0 0 60 48"><path d="m8 15 11 10L30 8l11 17 11-10-6 22H14L8 15Zm6 22h32m-31 5h30"/><circle cx="8" cy="13" r="2"/><circle cx="30" cy="6" r="2"/><circle cx="52" cy="13" r="2"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l11-3v12M9 8l11-3"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="15" rx="3" ry="2.5"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-whatsapp" viewBox="0 0 24 24"><path d="M21 11.5a9 9 0 0 1-13.5 7.8L3 21l1.5-4.7A9 9 0 1 1 21 11.5Z"/><path d="M8 7c-2 4 5 10 8 8l-2-3-2 1-2-2 1-2-3-2Z"/></symbol>
  </svg>

  <!-- ===== Encabezado: monograma, emblema y regreso a la invitación ===== -->
  <nav class="navigation" aria-label="Navegación principal">
    <a class="brand" href="index.html" data-home-link aria-label="Volver a la invitación"><span class="brand-mark" data-monogram>AV</span><span class="brand-copy"><small data-text="marca"></small><b data-value="nombreCelebracion">Adriana Victoria</b></span></a>
    <a class="nav-bridgerton" href="index.html" data-home-link aria-label="Volver a la invitación"><img src="assets/decoracion/logo-bridgerton.svg" alt="Bridgerton" width="420" height="264"></a>
    <a class="nav-rsvp" href="index.html" data-home-link><span data-text="volverInvitacion"></span></a>
  </nav>

  <main>
    <section class="rsvp section-pad" id="confirmar" aria-labelledby="rsvpTitle">
      <!-- ===== Presentación: título, fecha límite y lugares reservados ===== -->
      <div class="rsvp-intro">
        <p class="eyebrow" data-text="rsvpEtiqueta"></p>
        <h2 id="rsvpTitle" data-value="rsvp.titulo"></h2>
        <p class="section-description" data-value="rsvp.subtitulo"></p>
        <div class="rsvp-monogram"><svg aria-hidden="true"><use href="#i-crown"/></svg><span data-monogram>AV</span></div>
        <p class="rsvp-deadline" id="deadline"></p>
        <div class="reserved-seats" id="reservedSeats" hidden><b id="seatNumber"></b><span data-text="puestos"></span></div>
      </div>

      <div class="rsvp-form-wrap">
        <!-- ===== Formulario de confirmación ===== -->
        <form id="rsvpForm" novalidate>
          <div class="field"><label for="guestName" data-value="rsvp.etiquetaNombre"></label><input id="guestName" name="nombre" autocomplete="name" maxlength="120" required aria-describedby="nameError"><p class="field-error" id="nameError" hidden></p></div>
          <!-- confirmar.js añade aquí un campo por cada acompañante -->
          <div id="companions"></div>
          <fieldset class="attendance">
            <legend data-value="rsvp.etiquetaAsistencia"></legend>
            <div class="attendance-options"><label><input type="radio" name="asiste" value="si" required><span data-value="rsvp.opcionSi"></span><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></label><label><input type="radio" name="asiste" value="no"><span data-value="rsvp.opcionNo"></span></label></div>
            <p class="field-error" id="attendanceError" hidden></p>
          </fieldset>
          <div class="field"><label for="guestSong" data-value="rsvp.etiquetaCancion"></label><input id="guestSong" name="cancion" maxlength="200"></div>
          <div class="field"><label for="guestMessage" data-value="rsvp.etiquetaMensaje"></label><textarea id="guestMessage" name="mensaje" rows="3" maxlength="2000"></textarea></div>
          <button class="button button-ink submit-button" type="submit" id="submitRsvp"><span data-value="rsvp.boton"></span><svg class="icon"><use href="#i-arrow"/></svg></button>
          <p class="form-note" id="formNote">Tu respuesta se preparará para enviar por WhatsApp.</p>
          <p class="field-error" id="submitError" role="alert" hidden></p>
        </form>

        <!-- ===== Respuesta guardada: sello de aceptado y envío por WhatsApp ===== -->
        <div class="response-card" id="responseCard" hidden>
          <p class="eyebrow" id="responseEyebrow"></p>
          <h3 id="responseTitle"></h3>
          <p id="responseGuest"></p>
          <!-- Sello de aceptado, solo para quien confirma que asiste -->
          <div class="acceptance-seal" id="acceptedSeal" hidden><span data-text="selloAceptado">Accepted</span><small data-value="iniciales">AV</small></div>
          <p id="responseStatus"></p>
          <a class="button button-ink" id="whatsappLink" target="_blank" rel="noopener noreferrer"><svg class="icon"><use href="#i-whatsapp"/></svg><span data-text="whatsappBoton"></span></a>
          <p class="form-note" id="whatsappNote" data-text="whatsappNota"></p>
          <button class="text-link" type="button" id="editResponse" data-text="corregir"></button>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== Pie de página ===== -->
  <footer class="footer confirm-footer">
    <p class="footer-name" data-value="nombreCompleto"></p>
    <p class="footer-thanks" data-text="gracias"></p>
    <a class="text-link" href="index.html" data-home-link data-text="volverInvitacion"></a>
  </footer>

  <!-- ===== Música de fondo y avisos ===== -->
  <button class="music-toggle" id="musicToggle" aria-label="Escuchar la velada" aria-pressed="false"><svg class="icon"><use href="#i-music"/></svg><span data-text="musica"></span><i></i></button>
  <audio id="eventAudio" src="Audio.mp3" loop preload="auto"></audio>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ===== Scripts, en este orden: configuración, datos, servicios y luego la página ===== -->
  <script src="configuracion.js"></script>
  <script src="datos.js"></script>
  <script src="servicios.js"></script>
  <script src="confirmar.js"></script>
  <script src="musica.js"></script>
</body>
</html>
